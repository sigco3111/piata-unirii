<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js 런 비교 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #111; color: #eee; font: 14px system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #333; }
    header strong { margin-right: auto; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: calc(100% - 49px); }
    section { display: grid; grid-template-rows: auto 1fr; min-width: 0; border-right: 1px solid #333; }
    section:last-child { border: 0; }
    .bar { display: grid; grid-template-columns: minmax(150px, auto) minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 42px; padding: 7px 10px; background: #1b1b1b; }
    select { min-width: 0; background: #292929; color: inherit; border: 1px solid #444; padding: 5px; }
    .meta { color: #aaa; font-size: 12px; }
    a { margin-left: auto; color: #9cc8ff; }
    iframe { width: 100%; height: 100%; border: 0; background: #222; }
    .empty { display: grid; place-items: center; color: #888; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header><strong>런 비교 뷰어</strong><span>각 장면을 먼저 클릭한 다음 키보드 단축키를 사용하세요.</span></header>
  <main id="comparison"></main>
  <script type="module">
    const root = document.querySelector('#comparison');
    const runs = await fetch('./runs.json').then(response => {
      if (!response.ok) throw new Error(`runs.json 을 불러올 수 없습니다 (${response.status})`);
      return response.json();
    });

    if (!runs.length) {
      root.className = 'empty';
      root.textContent = '아직 등록된 런이 없습니다.';
    } else {
      // 한국어 라벨 매핑 — runs.json 의 model/effort 값을 한국어로 표시
      const providerLabel = { 'OpenAI': 'OpenAI', 'Anthropic': 'Anthropic' };
      const agentLabel = { 'Codex': 'Codex', 'Claude Code': 'Claude Code' };
      const effortLabel = { 'xhigh': '최고 effort' };
      // 런명(영문 식별자)을 사용자에게는 한국어 별칭으로 보여줍니다.
      // 런명 자체는 비교 뷰어 URL 쿼리·데이터 키로 보존해야 하므로 select value 는 영문, 표시 텍스트만 한국어로 변경합니다.
      const runDisplayName = {
        'gpt-5.6-sol-xhigh-01': 'OpenAI · GPT-5.6 솔로 (Codex)',
        'fable-5.1-xhigh-01': 'Anthropic · Fable 5.1 (Claude Code)',
        'gpt-astra-xhigh-01': 'OpenAI · GPT-Astra (Codex)',
        'opus-5-xhigh-02': 'Anthropic · Opus 5 (Claude Code)',
      };

      const formatStartedAt = value => {
        if (!value) return '알 수 없음';
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? value
          : new Intl.DateTimeFormat('ko-KR', { dateStyle: 'medium', timeStyle: 'medium' }).format(date);
      };

      const formatDuration = value => {
        if (!Number.isFinite(value) || value < 0) return '알 수 없음';
        const total = Math.floor(value);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        if (hours) return `${hours}시간 ${minutes ? `${minutes}분 ` : ''}${seconds}초`.trim();
        if (minutes) return `${minutes}분 ${seconds ? `${seconds}초` : ''}`.trim();
        return `${seconds}초`;
      };

      const makePane = selectedIndex => {
        const section = document.createElement('section');
        section.innerHTML = '<div class="bar"><select></select><span class="meta"></span><a target="_blank" rel="noopener">새 창으로 열기</a></div><iframe></iframe>';
        const select = section.querySelector('select');
        const meta = section.querySelector('.meta');
        const link = section.querySelector('a');
        const frame = section.querySelector('iframe');

        runs.forEach((run, index) => select.add(new Option(runDisplayName[run.name] || run.name, index)));
        select.value = Math.min(selectedIndex, runs.length - 1);

        const show = () => {
          const run = runs[Number(select.value)];
          const src = `../runs/${encodeURIComponent(run.name)}/index.html`;
          const startedAt = formatStartedAt(run.startedAt);
          const duration = formatDuration(run.durationSeconds);
          const provider = providerLabel[run.provider] || run.provider || '공급사 미상';
          const agent = agentLabel[run.agent] || run.agent || '에이전트 미상';
          const effort = effortLabel[run.effort] || run.effort || '';
          meta.textContent = `${provider} · ${agent} · ${run.model} · ${effort} · 시작 ${startedAt} · 소요 ${duration}`;
          link.href = src;
          link.textContent = '새 창으로 열기';
          frame.src = src;
          frame.title = run.name;
        };

        select.addEventListener('change', show);
        show();
        return section;
      };

      const defaultIndex = (name, fallback) => {
        const index = runs.findIndex(run => run.name === name);
        return index < 0 ? fallback : index;
      };
      root.append(
        makePane(defaultIndex('fable-5.1-xhigh-01', 0)),
        makePane(defaultIndex('gpt-astra-xhigh-01', 1)),
      );
    }
  </script>
</body>
</html>
