<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Piața Unirii · 클루즈나포카 — 복셀 미니어처</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c9c2b3'/><rect x='6' y='2' width='4' height='12' fill='%23d9d0ba'/><rect x='5' y='5' width='6' height='2' fill='%23b0472a'/></svg>">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="title">
  <h1>Piața Unirii</h1>
  <p>클루즈나포카 · 복셀 미니어처</p>
</div>

<div id="meter">
  <div class="row"><span>시간대</span><b id="m-time">맑은 낮</b></div>
  <div class="row"><span>카메라</span><b id="m-view">항공</b></div>
  <div class="row"><span>라벨</span><b id="m-labels">꺼짐</b></div>
  <div class="sep"></div>
  <div class="row"><span>FPS</span><b id="m-fps">–</b></div>
  <div class="row"><span>드로 콜</span><b id="m-calls">–</b></div>
  <div class="row"><span>삼각형</span><b id="m-tris">–</b></div>
</div>

<div id="help">
  <div class="hd">조작법 <em>(클릭하여 접기)</em></div>
  <ul>
    <li><kbd>좌클릭 드래그</kbd> 궤도 회전</li>
    <li><kbd>우클릭 드래그</kbd> 이동</li>
    <li><kbd>스크롤</kbd> 줌</li>
    <li class="gap"><kbd>R</kbd> 성당과 동상에 다시 중심</li>
    <li><kbd>F</kbd> 시네마틱 플라이오버</li>
    <li><kbd>T</kbd> 맑은 낮 / 골든아워</li>
    <li><kbd>V</kbd> 거리 수준 / 항공</li>
    <li><kbd>L</kbd> 랜드마크 라벨</li>
  </ul>
</div>

<div id="error"></div>

<div id="loading">
  <div class="card">
    <div class="mark">
      <span class="spire"></span><span class="tower"></span><span class="nave"></span><span class="roof"></span>
    </div>
    <h2>Piața Unirii</h2>
    <p class="sub">클루즈나포카, 트란실바니아</p>
    <div class="track"><div id="bar"></div></div>
    <p id="stage">준비 중</p>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
